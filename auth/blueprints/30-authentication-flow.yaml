version: 1
metadata:
  name: Authorled authentication flow
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # The sign-in flow of the product (openspec/specs/auth, «Конфигурация из blueprints»), with its
  # own stages (blueprints are applied in no fixed order, so nothing here depends on the default
  # blueprints): e-mail or username → password, only when the user has one → a code sent by
  # e-mail as the second factor (the device is set up on the first sign-in) → login. The web
  # frontend walks these stages through the flow executor API with its own screens.
  # The sign-up flow (openspec/specs/auth, «Регистрация») lives in this file too, so the link from
  # the e-mail stage does not depend on the order of blueprints: name and e-mail → the user is
  # created in screenwriters → the e-mail code confirms the address and saves the device → login.
  # The sign-up flow comes first: the e-mail stage below links to it (!KeyOf needs it above).
  # Fields of the admin interface (openspec/specs/auth, «Настройки админки»): an object with them is
  # declared twice. The `created` entry makes it on an empty schema with every field and is skipped
  # afterwards; the `present` entry right after it restores only the fields the product relies on
  # (an update of an existing object is partial), so edits of the other fields in the admin
  # interface survive releases.
  # Admin interface: name, title.
  - model: authentik_flows.flow
    id: flow-enrollment
    state: created
    identifiers:
      slug: authorled-enrollment
    attrs:
      name: Authorled sign-up
      title: Регистрация в Соавторе
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_flows.flow
    identifiers:
      slug: authorled-enrollment
    attrs:
      designation: enrollment
      authentication: require_unauthenticated
  # Admin interface: failed_attempts_before_cancel.
  - model: authentik_stages_password.passwordstage
    id: stage-password
    state: created
    identifiers:
      name: authorled-authentication-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
      failed_attempts_before_cancel: 5
  - model: authentik_stages_password.passwordstage
    identifiers:
      name: authorled-authentication-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
  - model: authentik_stages_identification.identificationstage
    id: stage-identification
    identifiers:
      name: authorled-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      # The password is a stage of its own: it is asked only when the account has one.
      password_stage: null
      case_insensitive_matching: true
      show_matched_user: true
      # An unknown address is reported at once (mockup v1: one e-mail screen for sign-in and
      # sign-up); attempts are limited by the password stage and the code throttling.
      pretend_user_exists: false
      enrollment_flow: !KeyOf flow-enrollment
  - model: authentik_policies_expression.expressionpolicy
    id: policy-has-password
    identifiers:
      name: authorled-user-has-password
    attrs:
      # Accounts from the sign-up flow have an empty password, which Django counts as usable:
      # only a real hash asks for the password step.
      expression: |
        user = request.context["pending_user"]
        return bool(user.password) and user.has_usable_password()
  # Admin interface: subject.
  - model: authentik_stages_authenticator_email.authenticatoremailstage
    id: stage-email-setup
    state: created
    identifiers:
      name: authorled-authenticator-email-setup
    attrs:
      friendly_name: Соавтор
      use_global_settings: true
      token_expiry: minutes=10
      subject: Код для входа в Соавтор
      template: email/coauthor-code.html
  - model: authentik_stages_authenticator_email.authenticatoremailstage
    identifiers:
      name: authorled-authenticator-email-setup
    attrs:
      friendly_name: Соавтор
      use_global_settings: true
      # The code e-mail and the code screen of the frontend say 10 minutes: change them together.
      token_expiry: minutes=10
      template: email/coauthor-code.html
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stage-mfa-validate
    identifiers:
      name: authorled-authentication-mfa-validation
    attrs:
      device_classes:
        - email
      not_configured_action: configure
      configuration_stages:
        - !KeyOf stage-email-setup
  # The TOTP second factor of the earlier flow is gone (code by e-mail instead).
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    state: absent
    identifiers:
      name: authorled-authenticator-totp-setup
  - model: authentik_stages_user_login.userloginstage
    id: stage-login
    identifiers:
      name: authorled-authentication-login
    attrs:
      session_duration: seconds=0
  # Admin interface: name, title.
  - model: authentik_flows.flow
    id: flow-authentication
    state: created
    identifiers:
      slug: authorled-authentication
    attrs:
      name: Authorled authentication
      title: Вход в Соавтор
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_flows.flow
    identifiers:
      slug: authorled-authentication
    attrs:
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      order: 10
    attrs:
      stage: !KeyOf stage-identification
  - model: authentik_flows.flowstagebinding
    id: binding-password
    identifiers:
      target: !KeyOf flow-authentication
      order: 20
    attrs:
      stage: !KeyOf stage-password
      # pending_user is known only after identification, so the policy runs when the stage comes.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-password
      policy: !KeyOf policy-has-password
    attrs:
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      order: 30
    attrs:
      stage: !KeyOf stage-mfa-validate
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-authentication
      order: 100
    attrs:
      stage: !KeyOf stage-login
  # Sign-up (openspec/specs/auth, «Регистрация»). The same group as in 10-groups.yaml, by its
  # identifiers only: new users join it whatever order the blueprints are applied in.
  - model: authentik_core.group
    id: group-screenwriters
    identifiers:
      name: screenwriters
  - model: authentik_stages_prompt.prompt
    id: prompt-email
    identifiers:
      name: authorled-enrollment-email
    attrs:
      field_key: email
      label: Почта
      type: email
      required: true
      order: 0
  # The username is the e-mail; the frontend sends it, the policy below checks it. A text field,
  # not hidden: Authentik fills hidden fields on the server and ignores what the client sends.
  - model: authentik_stages_prompt.prompt
    id: prompt-username
    identifiers:
      name: authorled-enrollment-username
    attrs:
      field_key: username
      label: Почта
      type: text
      required: true
      order: 1
  - model: authentik_stages_prompt.prompt
    id: prompt-name
    identifiers:
      name: authorled-enrollment-name
    attrs:
      field_key: name
      label: Имя и фамилия
      type: text
      required: true
      placeholder: Например, Анна Северова
      order: 2
  # A decision only, no side effects: the e-mail is in the list of allowed e-mails, one account per
  # e-mail, the username equals the e-mail, the name is not blank. The list comes before the
  # registered check, so a refusal does not tell whether an address has an account.
  # The list is the attribute allowed_emails of the group screenwriters (openspec/specs/auth,
  # «Список разрешённых почт»): a list of strings set in the admin interface, ["*"] for everyone.
  # The blueprints never set it, so releases keep it. A missing or broken list refuses every
  # sign-up and records a configuration_error event that names it; the person sees a short refusal.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-email-not-registered
    identifiers:
      name: authorled-email-not-registered
    attrs:
      expression: |
        from authentik.core.models import Group
        from authentik.events.models import Event, EventAction

        data = request.context.get("prompt_data", {})
        email = str(data.get("email", "")).strip()
        if data.get("username") != data.get("email"):
            ak_message("Имя пользователя должно совпадать с почтой.")
            return False
        group = Group.objects.filter(name="screenwriters").first()
        configured = None if group is None else group.attributes.get("allowed_emails")
        if not isinstance(configured, list) or not all(isinstance(item, str) for item in configured):
            # Event.new, not ak_create_event: that one prefixes the action with custom_ and copies
            # the form (e-mail, name) into the event.
            Event.new(
                EventAction.CONFIGURATION_ERROR,
                app="authorled-email-not-registered",
                message=(
                    "Sign-up is closed: the attribute allowed_emails of the group screenwriters "
                    "must be a list of e-mail strings (or [\"*\"])."
                ),
            ).save()
            ak_message("Регистрация временно недоступна.")
            return False
        allowed = [item.strip().lower() for item in configured if item.strip()]
        if allowed != ["*"] and email.lower() not in allowed:
            ak_message("Регистрация сейчас доступна только по приглашению.")
            return False
        if not str(data.get("name", "")).strip():
            ak_message("Введите имя.")
            return False
        if ak_user_by(email__iexact=email) is not None or ak_user_by(username__iexact=email) is not None:
            ak_message("Аккаунт с такой почтой уже есть.")
            return False
        return True
  - model: authentik_stages_prompt.promptstage
    id: stage-enrollment-prompt
    identifiers:
      name: authorled-enrollment-prompt
    attrs:
      fields:
        - !KeyOf prompt-email
        - !KeyOf prompt-username
        - !KeyOf prompt-name
      validation_policies:
        - !KeyOf policy-email-not-registered
  - model: authentik_stages_user_write.userwritestage
    id: stage-enrollment-write
    identifiers:
      name: authorled-enrollment-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      create_users_group: !KeyOf group-screenwriters
      user_type: internal
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      order: 10
    attrs:
      stage: !KeyOf stage-enrollment-prompt
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      order: 20
    attrs:
      stage: !KeyOf stage-enrollment-write
  # The account exists from here, but there is no token without the code: the device is saved
  # only after the right code, so an abandoned sign-up leaves no unconfirmed device.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      order: 30
    attrs:
      stage: !KeyOf stage-email-setup
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-enrollment
      order: 100
    attrs:
      stage: !KeyOf stage-login
  # The brand of the Authentik domain of the product; the default brand stays untouched.
  # Admin interface: branding_title (the pair of entries is explained at the top of the file).
  - model: authentik_brands.brand
    state: created
    identifiers:
      domain: !Env AUTH_BRAND_DOMAIN
    attrs:
      default: false
      branding_title: Соавтор
      flow_authentication: !KeyOf flow-authentication
  - model: authentik_brands.brand
    identifiers:
      domain: !Env AUTH_BRAND_DOMAIN
    attrs:
      default: false
      flow_authentication: !KeyOf flow-authentication
