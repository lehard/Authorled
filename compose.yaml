# Shared part of the stack: the PostgreSQL both modules use. The backend (agno/) and the
# auth module (auth/) declare their services in their own fragments, included below.
include:
  - agno/compose.yaml
  - auth/compose.yaml

services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    healthcheck:
      # Over TCP: during first-start initialization PostgreSQL answers on the socket only,
      # and services that connect over the network (authentik-db-init) would be refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - agentos

networks:
  agentos:

volumes:
  pgdata:
