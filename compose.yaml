services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    healthcheck:
      # Over TCP: during first-start initialization PostgreSQL answers on the socket only,
      # and services that connect over the network (authentik-db-init) would be refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - agentos

  # LiteLLM proxy: every chat and embedding call goes through it (litellm/config.yaml).
  # GigaChat TLS is verified against litellm/certs/ca-bundle.pem: the certifi CA
  # bundle with the Russian Trusted Root CA and Sub CA appended
  # (scripts/build_ca_bundle.sh). The bind mount
  # does not create a missing file, so the proxy refuses to start without it.
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.2
    container_name: agentos-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - type: bind
        source: ./litellm/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./litellm/certs/ca-bundle.pem
        target: /certs/ca-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /certs/ca-bundle.pem
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in .env}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:?GIGACHAT_CREDENTIALS must be set in .env}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:?GIGACHAT_SCOPE must be set in .env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - agentos

  # Module auth (modules/auth): Authentik runs in the shared database, schema
  # `authentik`, under its own role. authentik-db-init creates both on every `up`
  # (idempotent); the server and worker start only after it succeeds.
  authentik-db-init:
    image: agnohq/pgvector:18
    container_name: authentik-db-init
    restart: "no"
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-v", "authentik_password=${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD must be set in .env}", "-f", "/init/init.sql"]
    volumes:
      - type: bind
        source: ./modules/auth/db/init.sql
        target: /init/init.sql
        read_only: true
        bind:
          create_host_path: false
    environment:
      PGHOST: agentos-db
      PGPORT: "5432"
      PGUSER: ai
      PGPASSWORD: ai
      PGDATABASE: ai
    depends_on:
      agentos-db:
        condition: service_healthy
    networks:
      - agentos

  # Authentik: identity provider with its own UI (login, profile, admin). Blueprints in
  # modules/auth/blueprints configure it from empty state. The image tag is pinned.
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: authentik-server
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - type: bind
        source: ./modules/auth/blueprints
        target: /blueprints/custom
        read_only: true
        bind:
          create_host_path: false
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY must be set in .env}
      AUTHENTIK_POSTGRESQL__HOST: agentos-db
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: ai
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD must be set in .env}
      AUTHENTIK_POSTGRESQL__DEFAULT_SCHEMA: authentik
      # PostgreSQL is reached only over the compose network, without TLS.
      AUTHENTIK_POSTGRESQL__SSLMODE: disable
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:?AUTHENTIK_BOOTSTRAP_EMAIL must be set in .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?AUTHENTIK_BOOTSTRAP_PASSWORD must be set in .env}
      # Read by the blueprints (!Env).
      AUTH_FRONTEND_CLIENT_ID: ${AUTH_FRONTEND_CLIENT_ID:?AUTH_FRONTEND_CLIENT_ID must be set in .env}
      AUTH_FRONTEND_REDIRECT_URI: ${AUTH_FRONTEND_REDIRECT_URI:?AUTH_FRONTEND_REDIRECT_URI must be set in .env}
      AUTH_DEV_SERVICE_TOKEN: ${AUTH_DEV_SERVICE_TOKEN:?AUTH_DEV_SERVICE_TOKEN must be set in .env}
      AUTH_BRAND_DOMAIN: ${AUTH_BRAND_DOMAIN:?AUTH_BRAND_DOMAIN must be set in .env}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    networks:
      - agentos

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    volumes:
      - type: bind
        source: ./modules/auth/blueprints
        target: /blueprints/custom
        read_only: true
        bind:
          create_host_path: false
    environment: *authentik-env
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    # The server applies the database migrations; the worker starts after it is healthy.
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
      authentik-server:
        condition: service_healthy
    networks:
      - agentos

  # Writes the public signing keys of Authentik to modules/auth/jwks/jwks.json, which
  # the API reads as JWT_JWKS_FILE. Fails (and the API does not start) when it cannot.
  # Re-run after rotating the signing key: docker compose run --rm authentik-jwks-export
  authentik-jwks-export:
    image: curlimages/curl:8.11.1
    container_name: authentik-jwks-export
    restart: "no"
    entrypoint: ["/bin/sh", "/export/export.sh"]
    user: root
    volumes:
      - type: bind
        source: ./modules/auth/jwks
        target: /out
      - type: bind
        source: ./modules/auth/jwks/export.sh
        target: /export/export.sh
        read_only: true
        bind:
          create_host_path: false
    environment:
      AUTHENTIK_URL: http://authentik-server:9000
      AUTH_APPLICATION_SLUG: authorled
      # Blueprints create the provider shortly after the server is healthy.
      AUTH_JWKS_WAIT_SECONDS: "180"
    depends_on:
      authentik-server:
        condition: service_healthy
    networks:
      - agentos

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: agentos
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # --reload-dir limits the watcher to dirs that contain runtime code.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir agents --reload-dir app --reload-dir db --reload-dir evals
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      AGNO_TELEMETRY: "false"
      DB_DRIVER: postgresql+psycopg
      DB_HOST: agentos-db
      DB_PORT: "5432"
      DB_USER: ai
      DB_PASS: ai
      DB_DATABASE: ai
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set in .env}
      # Module auth: tokens are issued by Authentik, public keys come from authentik-jwks-export.
      JWT_JWKS_FILE: /app/modules/auth/jwks/jwks.json
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER must be set in .env}
      AUTH_FRONTEND_CLIENT_ID: ${AUTH_FRONTEND_CLIENT_ID:?AUTH_FRONTEND_CLIENT_ID must be set in .env}
    depends_on:
      agentos-db:
        condition: service_started
      litellm:
        condition: service_healthy
      authentik-jwks-export:
        condition: service_completed_successfully
    networks:
      - agentos
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agentos:

volumes:
  pgdata:
