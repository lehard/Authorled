# The set of the measurement of actions (openspec/specs/coauthor-actions-eval): requests of
# an author in the world of the demo stories (web/src/data/demo.json), each run in a fresh copy of the open draft.
#
# Every request is a `[[request]]` table:
# - `id`, `place` (tihaya-voda or posledniy-parom), `message`;
# - `expect`: the changing tool the request needs, or "none" when nothing may change;
# - for create_story_document: `kind` (character, location, world);
# - for update_story_document and update_story_note: `target`, the name of the card or the title of the note;
# - `fields`: profile fields the request names directly; "a|b" means one of them is enough;
# - for update_story_document: optional `role` and `name` the card must have after the request.
# The set is checked against core/fields.py and the demo stories before any model call (evals/coauthor/actions.py).

# --- Персонажи ---

