id = "dc-water"
section = "single"
message = "Где здесь вода? Назови одно–три места, которые можно сократить без потери смысла, и спроси меня о них."
expect = ["wide-review"]
place = "tihaya-voda"
action = "none"
open = { scene = 6 }

