# Checks of the mentor (openspec/changes/coauthor-mentor-checks, design, decision 9): the request of
# web/src/screens/project/chat/checks.ts word for word, sent over scene 6 of «Тихая вода» (the night kitchen,
# water-6) selected in the open screenplay. The part is not covered by domains and sections (spec «Наборы замера»).

