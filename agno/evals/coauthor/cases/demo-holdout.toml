  { role = "coauthor", text = "Аня, 24 года, дочь Веры: приехала надолго и не знает зачем. Живёт в городе, работает звукорежиссёром, привыкла задавать вопросы, на которые дома не отвечают. Страх, цель и особенности речи пока не заполнены." },
]

[[case]]
id = "dh-continuation-02"
