history = [
  { role = "author", text = "Оставь комментарий к реплике Ани «Мама говорит то же самое. Теми же словами.» в пятой сцене: тут Аня впервые замечает, что мать и Коля отвечают одинаково." },
  { role = "coauthor", text = "Предложил комментарий к реплике Ани в сцене 5. Он появится в тексте, когда вы подтвердите." },
]


