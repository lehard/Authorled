  { role = "author", text = "Разбери пятую сцену на пароме: она вообще что-то делает?" },
  { role = "coauthor", text = "Сцена 5 идёт сразу после четвёртой, где Лида пришла на последний рейс. Павел глушит мотор, паром разворачивает течением, они стоят рядом и смотрят на огни моста. Реплик нет. Образ сильный, но сцена держится только на нём, и её легко принять за проходную." },
]

[[case]]
id = "dh-continuation-03"
section = "continuation"
message = "И такой же к ответу Коли перед ней, «Он утонул. Всё.»: играть это надо резче, как отрезал."
expect = ["wide-review"]
