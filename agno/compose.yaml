# Backend module (agno/): the role the API connects with, migrations of the core schema, the LiteLLM
# proxy, the antivirus, the journal of agent runs (Phoenix) and the API.
# compose.yaml at the repository root includes this file; relative paths resolve from agno/,
# variables come from the root .env. The services use agentos-db, the agentos network and
# the services of the auth module declared in the other files.
services:
  # The role the API connects with: not a superuser, owns schema `ai`, no access to schema
  # `authentik` (db/init.sql). Runs on every `up` (idempotent) under the bootstrap user;
  # the API starts only after it succeeds.
  agentos-db-init:
    image: agnohq/pgvector:18
    container_name: agentos-db-init
    restart: "no"
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-v", "agentos_password=${AGENTOS_DB_PASSWORD:?AGENTOS_DB_PASSWORD must be set in .env}", "-f", "/init/init.sql"]
    volumes:
      - type: bind
        source: ./db/init.sql
        target: /init/init.sql
        read_only: true
        bind:
          create_host_path: false
    environment:
      PGHOST: agentos-db
      PGPORT: "5432"
      PGUSER: ai
      PGPASSWORD: ai
      PGDATABASE: ai
    depends_on:
      agentos-db:
        condition: service_healthy
      # Both init scripts grant CREATE on the database; run concurrently on a new database,
      # PostgreSQL rejects one of them ("tuple concurrently updated"). The backend waits for the
      # auth module, never the reverse.
      authentik-db-init:
        condition: service_completed_successfully
    networks:
      - agentos

  # LiteLLM proxy: every chat and embedding call goes through it (litellm/config.yaml).
  # GigaChat TLS is verified against litellm/certs/ca-bundle.pem: the certifi CA
  # bundle with the Russian Trusted Root CA and Sub CA appended
  # (agno/scripts/build_ca_bundle.sh). The bind mount
  # does not create a missing file, so the proxy refuses to start without it.
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.2
    container_name: agentos-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - type: bind
        source: ./litellm/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./litellm/certs/ca-bundle.pem
        target: /certs/ca-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /certs/ca-bundle.pem
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in .env}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:?GIGACHAT_CREDENTIALS must be set in .env}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:?GIGACHAT_SCOPE must be set in .env}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:?CLOUDRU_API_KEY must be set in .env}
      # Optional on purpose (owner's decision 2026-11-08, openspec/specs/llm-gateway): only the
      # routing exam's claude-sonnet / claude-opus use it; without it their calls fail with 401.
      ANTHROPIC_EXAM_API_KEY: ${ANTHROPIC_EXAM_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - agentos

  # Migrations of the product core schema `authorled` (openspec/specs/core/database): a one-shot step
  # under the role `agentos` after agentos-db-init; the API starts only after it succeeds and never
  # migrates by itself. Same build as agentos-api; it needs only the DB_* variables, not .env.
  agentos-migrate:
    build:
      context: ..
      dockerfile: agno/Dockerfile
      target: agentos
    container_name: agentos-migrate
    restart: "no"
    working_dir: /app/agno
    # The core first, then the billing module, whose first migration moves its tables out of the core
    # (openspec/specs/billing/module, «Миграции биллинга»).
    command: ["sh", "-c", "alembic upgrade head && alembic -c billing/alembic.ini upgrade head"]
    volumes:
      - ..:/app
    environment:
      WAIT_FOR_DB: "True"
      DB_DRIVER: postgresql+psycopg
      DB_HOST: agentos-db
      DB_PORT: "5432"
      DB_USER: agentos
      DB_PASS: ${AGENTOS_DB_PASSWORD:?AGENTOS_DB_PASSWORD must be set in .env}
      DB_DATABASE: ai
    depends_on:
      agentos-db-init:
        condition: service_completed_successfully
    networks:
      - agentos

  # Antivirus for uploaded files (openspec/specs/runtime, «Антивирус ClamAV»): clamd over TCP 3310.
  # The API checks every file here before parsing or storing it. The image ships the signature
  # databases and updates them with freshclam inside the container; the volume keeps them across
  # restarts. Port 3310 is published on loopback for the API on the host (./scripts/dev.sh api);
  # compose.prod.yaml removes it.
  clamav:
    image: clamav/clamav-debian:1.5.3
    container_name: agentos-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - agentos

  # The role and schema of Phoenix, the journal of agent runs (phoenix/init.sql): no access to the
  # data of the product. Runs on every `up` (idempotent) under the bootstrap user, after
  # agentos-db-init so the two never update the catalog at the same time.
  phoenix-db-init:
    image: agnohq/pgvector:18
    container_name: phoenix-db-init
    restart: "no"
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-v", "phoenix_password=${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD must be set in .env}", "-f", "/init/init.sql"]
    volumes:
      - type: bind
        source: ./phoenix/init.sql
        target: /init/init.sql
        read_only: true
        bind:
          create_host_path: false
    environment:
      PGHOST: agentos-db
      PGPORT: "5432"
      PGUSER: ai
      PGPASSWORD: ai
      PGDATABASE: ai
    depends_on:
      agentos-db:
        condition: service_healthy
      agentos-db-init:
        condition: service_completed_successfully
    networks:
      - agentos

  # Phoenix: the journal of agent runs (openspec/specs/agent-tracing). The API sends it spans over
  # OTLP/HTTP on 6006, the same port serves its UI. Published on loopback only: the owner opens it
  # through an SSH tunnel, it has no login of its own and no route in Caddy. No requests to the
  # internet of its own (telemetry, fonts), traces older than 30 days are deleted by Phoenix.
  phoenix:
    image: arizephoenix/phoenix:version-20.26.1-nonroot
    container_name: agentos-phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_POSTGRES_HOST: agentos-db
      PHOENIX_POSTGRES_PORT: "5432"
      PHOENIX_POSTGRES_USER: phoenix
      PHOENIX_POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:?PHOENIX_DB_PASSWORD must be set in .env}
      PHOENIX_POSTGRES_DB: ai
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    mem_limit: 1g
    healthcheck:
      # The image has no shell or curl, only Python.
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      phoenix-db-init:
        condition: service_completed_successfully
    networks:
      - agentos

  agentos-api:
    build:
      context: ..
      dockerfile: agno/Dockerfile
      target: agentos
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # --reload-dir limits the watcher to dirs that contain runtime code.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/agno/agents --reload-dir /app/agno/app --reload-dir /app/agno/db --reload-dir /app/agno/evals
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ..:/app
    env_file:
      - path: ../.env
        required: false
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      AGNO_TELEMETRY: "false"
      DB_DRIVER: postgresql+psycopg
      DB_HOST: agentos-db
      DB_PORT: "5432"
      DB_USER: agentos
      DB_PASS: ${AGENTOS_DB_PASSWORD:?AGENTOS_DB_PASSWORD must be set in .env}
      DB_DATABASE: ai
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set in .env}
      # Module auth: tokens are issued by Authentik, public keys come from authentik-jwks-export.
      JWT_JWKS_FILE: /app/auth/jwks/jwks.json
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER must be set in .env}
      AUTH_FRONTEND_CLIENT_ID: ${AUTH_FRONTEND_CLIENT_ID:?AUTH_FRONTEND_CLIENT_ID must be set in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      PHOENIX_URL: http://phoenix:6006
    depends_on:
      agentos-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      authentik-jwks-export:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    networks:
      - agentos
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clamav-db:
