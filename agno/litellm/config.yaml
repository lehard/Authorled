# LiteLLM proxy: the only path from AgentOS and Claude Code to model providers.
# The application knows only the aliases below (app/settings.py); provider model
# names change here. Keys come from the proxy container's environment.
model_list:
  # Agents by default: DeepSeek without thinking.
  - model_name: deepseek-fast
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: disabled

  # OS Manager, Company Manager and Claude Code: DeepSeek with thinking.
  - model_name: deepseek-thinking
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  # Knowledge embeddings, GigaChat API: Embeddings-2, 1024 dimensions, 512 input tokens.
  # The GigaChat provider reads GIGACHAT_CREDENTIALS and GIGACHAT_SCOPE from the
  # environment. drop_params only here: OpenAIEmbedder always sends `dimensions`,
  # which this provider rejects; the model's fixed 1024 matches app/settings.py.
  - model_name: gigachat-embeddings
    litellm_params:
      model: gigachat/Embeddings-2
      drop_params: true

  # Knowledge embeddings on Cloud.ru Evolution Foundation Models (OpenAI-compatible API).
  # All three return 1024 dimensions. drop_params: Cloud.ru rejects `dimensions`
  # ("does not support Matryoshka embeddings"), which OpenAIEmbedder always sends.
  # The active alias is chosen by EMBEDDINGS_MODEL. The certificate chain (GlobalSign)
  # is verified by the proxy's CA bundle.
  - model_name: giga-embeddings
    litellm_params:
      model: openai/ai-sage/Giga-Embeddings-instruct-480M
      api_base: https://foundation-models.api.cloud.ru/v1
      api_key: os.environ/CLOUDRU_API_KEY
      drop_params: true

  - model_name: bge-m3-embeddings
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: https://foundation-models.api.cloud.ru/v1
      api_key: os.environ/CLOUDRU_API_KEY
      drop_params: true

  - model_name: qwen3-embeddings
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: https://foundation-models.api.cloud.ru/v1
      api_key: os.environ/CLOUDRU_API_KEY
      drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
