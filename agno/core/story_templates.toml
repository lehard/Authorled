# Structure templates of a new story (core/story_templates.py, openspec/specs/api/stories).
# A template: `id`, `name`, `description` and acts; an act: `name` and points; a point: `name` and `hint`.
# Every field is required and unknown fields are refused. The order here is the order in the dialog and the text.

[[template]]
id = "three-acts"
name = "Три акта"
description = "Классическое деление на завязку, развитие и развязку. Подходит почти любой истории."

[[template.act]]
name = "Завязка"

[[template.act.point]]
name = "Обычный мир"
hint = "Кто герой и как он живёт до начала истории? Чего ему не хватает?"

[[template.act.point]]
name = "Побуждающее событие"
hint = "Что случается и выбивает героя из привычной жизни?"

[[template.act.point]]
name = "Первый поворот"
hint = "Какое решение героя отрезает путь назад и запускает главное действие?"

[[template.act]]
name = "Развитие"

[[template.act.point]]
name = "Новые правила"
hint = "С чем герой сталкивается в новом положении? Как он пробует добиться цели?"

[[template.act.point]]
name = "Середина"
hint = "Что меняет ставки или взгляд героя на цель?"

[[template.act.point]]
name = "Всё рушится"
hint = "Где герой дальше всего от цели? Что он теряет?"

[[template.act]]
name = "Развязка"

[[template.act.point]]
name = "Кульминация"
hint = "Как герой встречает главное препятствие и что выбирает?"

[[template.act.point]]
name = "Финал"
hint = "Какими стали герой и его мир после решающего выбора?"

[[template]]
id = "hero-journey"
name = "Путешествие героя"
description = "Двенадцать этапов пути из привычного мира в неизвестный и обратно: схема Кристофера Воглера по мотивам Джозефа Кэмпбелла."

[[template.act]]
name = "Отправление"

[[template.act.point]]
name = "Обычный мир"
hint = "Как живёт герой до приключения? Что в его жизни просит перемен?"

[[template.act.point]]
name = "Зов к приключению"
hint = "Что зовёт героя прочь из привычной жизни?"

[[template.act.point]]
name = "Отказ от зова"
hint = "Почему герой медлит или отказывается? Чего он боится?"

[[template.act.point]]
name = "Встреча с наставником"
hint = "Кто или что даёт герою совет, знание или решимость?"

[[template.act.point]]
name = "Первый порог"
hint = "В какой момент герой входит в новый мир, из которого не вернётся прежним?"

[[template.act]]
name = "Испытания"

[[template.act.point]]
name = "Союзники и враги"
hint = "Кого герой встречает в новом мире и чему учится?"

[[template.act.point]]
name = "Подступы к пещере"
hint = "Как герой готовится к главной опасности?"

[[template.act.point]]
name = "Главное испытание"
hint = "Где герой сталкивается с главным страхом и едва не гибнет?"

[[template.act.point]]
name = "Награда"
hint = "Что герой получает, пройдя испытание?"

[[template.act]]
name = "Возвращение"

[[template.act.point]]
name = "Обратный путь"
hint = "Что гонит героя назад и чем грозит возвращение?"

[[template.act.point]]
name = "Воскресение"
hint = "Какое последнее испытание окончательно меняет героя?"

[[template.act.point]]
name = "Возвращение с эликсиром"
hint = "С чем герой возвращается и что это меняет для других?"

[[template]]
id = "fifteen-points"
name = "15 опорных точек"
description = "Подробная разметка полнометражного сценария: пятнадцать опорных точек от первого образа до последнего."

[[template.act]]
name = "Первый акт"

[[template.act.point]]
name = "Первый образ"
hint = "Какая картинка в начале показывает героя и его мир до перемен?"

[[template.act.point]]
name = "Заявка темы"
hint = "Кто вслух называет то, чему герою предстоит научиться?"

[[template.act.point]]
name = "Завязка"
hint = "Кто герой, что в его жизни не так и что он может потерять?"

[[template.act.point]]
name = "Катализатор"
hint = "Какое событие ломает привычный уклад?"

[[template.act.point]]
name = "Сомнения"
hint = "Как герой колеблется, прежде чем действовать?"

[[template.act.point]]
name = "Переход во второй акт"
hint = "Какое решение героя уводит его в новый мир?"

[[template.act]]
name = "Второй акт"

[[template.act.point]]
name = "Вторая линия"
hint = "Какая новая линия — любовная, дружеская, линия наставника — раскрывает тему?"

[[template.act.point]]
name = "Обещание жанра"
hint = "Ради каких сцен зритель пришёл на этот фильм?"

[[template.act.point]]
name = "Середина"
hint = "Ложная победа или ложное поражение: что поднимает ставки?"

[[template.act.point]]
name = "Враги наступают"
hint = "Как растут давление снаружи и сомнения внутри?"

[[template.act.point]]
name = "Всё потеряно"
hint = "Что герой теряет в самой низкой точке?"

[[template.act.point]]
name = "Тёмная ночь"
hint = "Как герой переживает потерю и что понимает?"

[[template.act]]
name = "Третий акт"

[[template.act.point]]
name = "Переход в третий акт"
hint = "Какое открытие даёт герою новый путь?"

[[template.act.point]]
name = "Финал"
hint = "Как герой применяет то, чему научился, и чем это кончается?"

[[template.act.point]]
name = "Последний образ"
hint = "Какая картинка показывает, как изменились герой и мир с первого образа?"

[[template]]
id = "tv-episode"
name = "Эпизод сериала"
description = "Серия часовой драмы: холодное открытие, четыре акта и крючок к следующей серии."

[[template.act]]
name = "Тизер"

[[template.act.point]]
name = "Холодное открытие"
hint = "Какая сцена до заставки сразу захватывает зрителя?"

[[template.act]]
name = "Акт 1"

[[template.act.point]]
name = "Задача эпизода"
hint = "Какую задачу герой получает в этой серии?"

[[template.act]]
name = "Акт 2"

[[template.act.point]]
name = "Осложнение"
hint = "Что мешает решить задачу и как растут ставки?"

[[template.act]]
name = "Акт 3"

[[template.act.point]]
name = "Кризис"
hint = "Где герой ближе всего к провалу?"

[[template.act]]
name = "Акт 4"

[[template.act.point]]
name = "Развязка эпизода"
hint = "Как решается задача серии и чего это стоит?"

[[template.act]]
name = "Тег"

[[template.act.point]]
name = "Крючок"
hint = "Что заставит зрителя ждать следующую серию?"
