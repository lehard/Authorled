# Тарифы (openspec/specs/core/subscriptions, «Тарифы как данные»). Код ядра их только читает (core/plans.py);
# ошибка в файле останавливает старт API. Все поля тарифа обязательны.
#
#   name           название для людей
#   price_rub      цена в рублях за период
#   period_months  длина периода в месяцах
#   limit_rub      лимит расхода соавтора в рублях за период
#   purchasable    можно ли купить тариф

# Тариф новых аккаунтов: GET /api/v1/me создаёт подписку на него.
signup_plan = "beta"

# Бета-тестеры: бесплатно, месяц от регистрации, продлевается сам (владелец, 2026-11-07).
[plans.beta]
name = "Бета"
price_rub = 0
period_months = 1
limit_rub = 500
purchasable = false
