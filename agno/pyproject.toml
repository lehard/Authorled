[project]
name = "agentos-docker"
version = "1.0.0"
description = "AgentOS: a production runtime for agents. Self-hosted Docker sibling of the agentos template family."
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,pgvector,psycopg,csv,excel,docx,pdf,website,claude,agentcore-sandbox,agui]==3.1.10",
  "alembic",
  "anthropic",
  "cel-python",
  "httpx",
  "openai",
  "parallel-web",
  "pyjwt[crypto]",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "core*", "db*", "demo*", "evals*", "teams*"]
namespaces = false

[tool.pytest.ini_options]
# Core tests on real PostgreSQL: run them with ./scripts/dev.sh test (database ai_test).
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
