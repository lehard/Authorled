version: 1
metadata:
  name: Authorled service accounts
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Service account for development tooling (curl, scripts/auth_check.sh, scripts/mcp_check.sh).
  # Its app password comes from AUTH_DEV_SERVICE_TOKEN in .env. Plugin accounts are added the same way.
  - model: authentik_core.user
    id: user-sa-dev
    identifiers:
      username: sa-dev
    attrs:
      name: Development service account
      type: service_account
      path: goauthentik.io/service-accounts
      groups:
        - !Find [authentik_core.group, [name, plugins]]
  - model: authentik_core.token
    identifiers:
      identifier: sa-dev-token
    attrs:
      user: !KeyOf user-sa-dev
      intent: app_password
      key: !Env AUTH_DEV_SERVICE_TOKEN
      expiring: false
