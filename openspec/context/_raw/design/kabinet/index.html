  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 5.5l3 3L8 19H5v-3z"/><path d="M13.5 7.5l3 3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M4 15l4-5 4 3 4-7 4 4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14.2a5 5 0 0 1 2.6 4.8"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
  <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20 4C12 4 8 9 8 16v4"/><path d="M8 16c5 0 9-3 10.5-8"/><path d="M4 20l4-4"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="rail">
    <div class="cover" data-open="home">
      <div class="cover-art"></div>
      <div><b>Тихая вода</b><small>полный метр · драма</small></div>
    </div>
    <div class="path" id="path"></div>
  </aside>
  <main class="desk" id="desk"></main>
</div>
<div class="tools">
  <span class="saved" id="saved" role="status"><i></i><span>Сохранено</span></span>
  <button class="tool" id="cmdBtn" title="Поиск и команды"><svg class="i"><use href="#i-search"/></svg>Поиск<kbd>⌘K</kbd></button>
  <button class="tool" id="focusBtn" title="Режим фокуса (F)"><svg class="i"><use href="#i-focus"/></svg>Фокус</button>
  <div class="themes" role="group" aria-label="Освещение">
    <button data-theme-btn="light" aria-pressed="true" title="Утро"><svg class="i"><use href="#i-sun"/></svg></button>
    <button data-theme-btn="sepia" aria-pressed="false" title="Бумага"><svg class="i"><use href="#i-page"/></svg></button>
    <button data-theme-btn="dark" aria-pressed="false" title="Вечер у лампы"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
  <button class="tool" data-open="settings" title="Настройки" aria-label="Настройки"><svg class="i"><use href="#i-gear"/></svg></button>
</div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Поиск и команды">
  <div class="pal">
    <div class="pal-in"><svg class="i"><use href="#i-search"/></svg><input id="palin" autocomplete="off" placeholder="Документ, сцена, персонаж, цитата или действие…" /><kbd>Esc</kbd></div>
    <div class="pal-list" id="pallist"></div>
    <div class="pal-foot">↑ ↓ выбрать · Enter открыть · Esc закрыть</div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="pop" id="acpop" hidden role="listbox" aria-label="Подсказки"></div>
<div class="pop" id="find" hidden role="search" aria-label="Найти и заменить">
  <div class="f-row"><svg class="i"><use href="#i-search"/></svg><input id="findin" autocomplete="off" placeholder="Найти" /><span class="f-n" id="findn"></span><button class="f-b" id="findprev" data-act="find-step" data-k="-1" title="Предыдущее (Shift+Enter)"><svg class="i"><use href="#i-up"/></svg></button><button class="f-b" id="findnext" data-act="find-step" data-k="1" title="Следующее (Enter)"><svg class="i"><use href="#i-down"/></svg></button><button class="f-b" data-act="find-rep-toggle" aria-pressed="false" title="Заменить"><svg class="i"><use href="#i-pencil"/></svg><span class="lbl-rep">Заменить</span></button><button class="f-b" data-act="find-close" title="Закрыть (Esc)"><svg class="i"><use href="#i-close"/></svg></button></div>
  <div class="f-row" id="findrep" hidden><svg class="i"><use href="#i-pencil"/></svg><input id="repin" autocomplete="off" placeholder="Заменить на" /><button class="f-b" id="reponce" data-act="find-rep">Заменить</button><button class="f-b" id="repall" data-act="find-rep-all">Все</button></div>
  <div class="f-scope"><span>Где</span><div class="seg" id="findscope" role="group" aria-label="Где искать"></div><span class="f-note" id="findnote"></span></div>
</div>
<div class="pop" id="eltbar" hidden role="toolbar" aria-label="Тип абзаца"></div>
<div class="pop" id="pcard" hidden role="dialog" aria-label="Персонаж"></div>
<div class="pop" id="selbar" hidden role="toolbar" aria-label="Выделенный текст">
  <button class="fmt" data-act="fmt" data-k="bold" title="Жирный"><b>Ж</b></button><button class="fmt" data-act="fmt" data-k="italic" title="Курсив"><i>К</i></button><button class="fmt" data-act="fmt" data-k="underline" title="Подчёркнутый"><u>Ч</u></button><span class="sep f"></span>
  <button class="ai" data-act="sel-ask"><svg class="i"><use href="#i-ai"/></svg>Спросить</button><button data-act="sel-vars">Варианты</button><button data-act="sel-check" title="Сверить реплику с профилем персонажа">Сверить</button><span class="sep"></span><button data-act="sel-note" title="Заметка себе"><svg class="i"><use href="#i-pencil"/></svg><span class="lbl-note">Заметка</span></button>
</div>
<div class="ritual" id="ritual" role="dialog" aria-modal="true"></div>
<div class="ask" id="ask">
  <div class="convo" id="convo"></div>
  <div class="askbar" id="askbar">
    <svg class="i glyph"><use href="#i-ai"/></svg>
    <input id="askin" autocomplete="off" />
    <span class="ctx" id="askctx"></span>
    <button class="send" aria-label="Отправить"><svg class="i"><use href="#i-send"/></svg></button>
  </div>

// ——— Карта пути: извилистая дорога из 22 шагов ———
function journeySvg() {
  const W = 980, perRow = [8, 8, 6], rowH = 132, x0 = 50, x1 = W - 50;
  const pts = []; let i = 0;
  perRow.forEach((cnt, r) => {
    for (let k = 0; k < cnt; k++) {
      const t = perRow[0] === 1 ? 0 : k / (perRow[0] - 1);
      const x = r % 2 === 0 ? x0 + t * (x1 - x0) : x1 - t * (x1 - x0);
      pts.push([x, 46 + r * rowH, STEPS[i++]]);
    }
  });
  const pathD = (ps) => ps.reduce((acc, [bx, by], k) => {
    if (k === 0) return `M ${bx} ${by}`;
    const [ax, ay] = ps[k - 1];
    if (ay === by) return acc + ` L ${bx} ${by}`;
    const dir = ax > W / 2 ? 1 : -1;
    return acc + ` C ${ax + dir * 90} ${ay}, ${bx + dir * 90} ${by}, ${bx} ${by}`;
  }, "");
  const d = pathD(pts);
  const col = { approved: "var(--ok)", ready: "var(--accent)", in_progress: "var(--wip)", draft: "var(--wip)", stale: "var(--warn)", conflict: "var(--bad)", not_started: "var(--ink-3)" };
  const nodes = pts.map(([x, y, [n, name, s, key]]) => {
    const words = name.split(" "); const l1 = words.slice(0, Math.ceil(words.length / 2)).join(" "), l2 = words.slice(Math.ceil(words.length / 2)).join(" ");
    const filled = s === "approved";
    const next = n === nextStepN();
    return `<g class="jnode" ${key ? `data-open="${key}"` : n === 20 ? `data-open="scene"` : ""}>
      ${next ? `<circle class="glow" cx="${x}" cy="${y}" r="20" fill="var(--accent)"/>` : ""}
      <circle class="ring" cx="${x}" cy="${y}" r="13" fill="${filled ? col[s] : "var(--paper)"}" stroke="${col[s]}" stroke-width="2" ${s === "not_started" ? 'stroke-dasharray="2 3"' : ""}/>
      ${filled ? `<path d="M${x - 5} ${y} l3.5 3.5 l6.5 -7" stroke="var(--paper)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : `<text class="num" x="${x}" y="${y + 4}" text-anchor="middle">${n}</text>`}
      <text x="${x}" y="${y + 34}" text-anchor="middle">${l1}</text>${l2 ? `<text x="${x}" y="${y + 50}" text-anchor="middle">${l2}</text>` : ""}
    </g>`;
  }).join("");
  const fork = pts[11];
  return `<svg class="map" viewBox="0 0 ${W} ${46 + 2 * rowH + 70}">
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
    <g><rect x="${fork[0] - 64}" y="${fork[1] - 46}" width="128" height="22" rx="11" fill="var(--ai-soft)"/><text x="${fork[0]}" y="${fork[1] - 31}" text-anchor="middle" style="font: 600 11px var(--font-ui); fill: var(--ai)">развилка формата</text></g>
    ${nodes}</svg>`;
}

  // ——— Связка 2: этап с пустого листа и утверждение ———
  d11: () => {
    const s = STATE.d11, at = s.answers.length, full = at === D11.length;
    const body = D11.map((q, i) => `<h2>${q.h}</h2>` + (i < at
      ? `<p class="${s.own[i] ? "" : "by-ai"}" data-a="${q.k}" data-ans="${i}" ${s.approved ? "" : 'contenteditable="true"'}>${esc(s.answers[i])}</p>`
      : `<p class="ph ${i === at ? "now" : ""}" data-a="${q.k}">${q.ph}</p>`)).join("");
    const pill = s.approved ? `<span class="pill approved"><i></i>Утверждён</span>только что`
      : full ? `<span class="pill ready"><i></i>Ждёт утверждения</span>остались ваши пункты`
      : `<span class="pill in_progress"><i></i>Черновик</span>${at} из ${D11.length} ответов`;
    const notes = D11.slice(0, at).map((q, i) => `<div class="note done" data-for="${q.k}"><div class="who"><span class="av">${ico("check")}</span>${s.own[i] ? "Ваш вариант" : "Вариант соавтора"}<small>правится в тексте</small></div></div>`).join("")
      + (full ? `<div class="note fresh" data-for="check"><div class="who"><span class="av">${ico("ai")}</span>Перед утверждением</div>${s.approved ? "Утверждено вами. Если передумаете — сначала покажу, что изменение заденет." : "Три формальных пункта я проверил сам. Два последних — о вашем отношении к истории: их отмечаете только вы."}</div>` : qNote(D11[at], at));
    return `<div class="stage doc"><article class="sheet">
        <div class="eyebrow">Шаг 11 · Основа истории</div>
        <h1>Главный вопрос</h1>

        <div class="prose">${body}${full ? `<div class="checklist" data-a="check"><h2>Перед утверждением</h2>${CHECKS.map(ckRow).join("")}</div>` : ""}</div>
      </article><aside class="margin" id="margin">${notes}</aside></div>`;

  // ——— Связка 3: изменение утверждённого решения ———
  impact: () => {
    const c = STATE.chg;
    const head = `<div class="eyebrow">Изменение утверждённого решения</div><h1>${c === "planned" ? "План пересмотра" : "Вы меняете «Манифест темы»"}</h1>`;
    const diff = (editable) => `<div class="diff ${editable ? "" : "fixed"}"><div class="label">Тематический вопрос</div><p class="was">${esc(STATE.chgOld)}</p><p class="now" id="newq" ${editable ? 'contenteditable="true"' : ""}>${esc(STATE.chgNew)}</p></div>`;
    const wrap = (inner) => `<div class="stage"><article class="sheet wide">${head}${inner}</article></div>`;
    if (c === "edit") return wrap(`<p class="lede">На этот документ опираются другие. Прежде чем сохранить, я проверю, что изменение задевает. Без вашего согласия ничего не поменяется.</p>${diff(true)}
      <div class="row-acts"><button class="approve" data-act="scan">${ico("ai")}Проверить последствия</button><button class="chipbtn quiet" data-act="cancel-change">Отменить</button></div>`);
    if (c === "scan") return wrap(`${diff(false)}${SCAN.map(rrow).join("")}`);
    if (c === "planned") return wrap(`<p class="lede">Новая формулировка темы сохранена. Задетые документы отмечены на пути слева.</p>${diff(false)}${planBox()}`);
    const n = IMPACT.length + UNTOUCHED.length;
    return wrap(`${diff(false)}
      <div class="impact-grid">${graphSvg()}<div class="tally"><b>Задето ${IMPACT.length} документа из ${n}</b><p>Два устарели — их стоит перечитать с новой темой.</p><p>Один противоречит: кульминация отвечает на старый вопрос.</p><p>Остальные ${UNTOUCHED.length} я проверил — они держатся.</p></div></div>
      <div class="label">Что задето</div>
      ${IMPACT.map(vitem).join("")}
      <details class="calm-list"><summary>Проверено и не задето · ${UNTOUCHED.length}</summary><ul>${UNTOUCHED.map(([, name, why]) => `<li><b>${name}</b> — ${why}</li>`).join("")}</ul></details>
      ${planBox()}`);
  },

  // ——— Связка 4: библия проекта и карточки сцен ———
  bible: () => {

        ${boardSeg("cards")}</div>

  // ——— Стандартное: версии, экспорт, настройки, состояния ———
  versions: () => {
    const { list, sel, base, changes } = verContext(), cur = list.at(-1), isCur = sel.id === "cur";
    const what = isCur ? "Текущая версия" : `${sel.name ? `Версия ${sel.name}` : "Автосохранение"} · ${sel.day}, ${sel.time}`;
    const vs = !STATE.verShow ? "" : !base ? "первая версия" : !changes.length ? "без изменений" : "правки подсвечены";
    const secs = D2_SECTIONS.map((h, i) => {
      const changed = STATE.verShow && changes.includes(i), text = sel.text[i];
      const body = changed ? renderDiff(wdiff(base.text[i], text), "both", sel.by) : text ? esc(text) : '<span class="empty-p">раздела в этой версии нет</span>';
      const restore = !isCur && text !== cur.text[i] ? `<button class="linkbtn sec-restore" data-act="ver-sec" data-k="${i}">Вернуть только этот раздел</button>` : "";
      return `<section class="vsec ${changed ? "chg" : ""}"><h2>${h}</h2><p>${body}</p>${restore}</section>`;
    }).join("");
    return `<div class="stage doc"><article class="sheet">
        <div class="eyebrow">Шаг 2 · История версий</div>
        <h1>Манифест темы</h1>
        <div class="vmeta"><b>${sel.kind === "approved" ? "Утверждена · " : ""}${what}</b>${vs ? `<span>${vs}</span>` : ""}</div>
        <div class="prose">${secs}</div>
      </article>${versionTimeline(list)}</div>`;
  },

    const fmts = EXP_FMT.map(([k, t]) => `<button class="${x.fmt === k ? "on" : ""}" data-act="exp-fmt" data-k="${k}" ${prose && SCRIPT_ONLY.includes(k) ? 'disabled title="Только для сценария"' : ""}>${t}</button>`).join("");
    const trow = (k, t, s, extra = "") => `<div class="trow"><span>${t}<small>${s}</small></span><button class="toggle ${x[k] ? "on" : ""}" data-act="exp-t" data-k="${k}" ${extra}><i></i></button></div>`;

          <div class="srow"><div><b>Размер текста</b></div><div><div class="size-row">А<input type="range" min="16" max="22" step="1" value="${s.size}" id="sizein" aria-label="Размер текста" /><span id="sizeval">${s.size} px</span></div>
            <p class="sample">Вера двадцать лет хранит тайну гибели брата и уверена, что этим бережёт семью.</p></div></div>
          <div class="srow"><div><b>Ширина листа</b></div><div>${seg("width", [["narrow", "Узкий"], ["normal", "Обычный"], ["wide", "Широкий"]])}</div></div>

          <div class="srow"><div><b>Номера сцен</b><small>на полях сценария</small></div><div>${tog("numbers")}</div></div>
          <div class="srow"><div><b>Проверка орфографии</b></div><div>${tog("spell")}</div></div>
          <div class="srow"><div><b>Сохранение</b></div><div class="okline">${ico("check")}Автоматически, после каждой правки. Без связи — на этом устройстве, потом отправится само.</div></div>

            <div class="fixed-note">${ico("ai")}Противоречия с утверждёнными документами и устаревшее показываю всегда — это не выключается.</div></div></div>
          <div class="srow"><div><b>Обращение</b></div><div>${seg("address", [["vy", "На «вы»"], ["ty", "На «ты»"]])}</div></div>

// Обновляет строку параметров на лету, не трогая поле, в котором сейчас пишут

function mfilterHtml(ids) {

  const h = SCRIPT[14].html, ai = (ids.includes(14) ? [/mark sugg" data-a="door"/.test(h), /mark stale" data-a="stale"/.test(h), STATE.sceneConflict].filter(Boolean).length : 0) + STATE.dyn.filter((d) => d.kind !== "mine" && ids.includes(d.sc)).length;
  const b = (k, label, c) => `<button aria-pressed="${STATE.mfilter === k}" data-act="mfilter" data-k="${k}">${label}${c === null ? "" : `<small>${c}</small>`}</button>`;
  return `<div class="mfilter"><div class="seg" role="group" aria-label="Какие заметки показывать">${b("all", "Все", null)}${b("ai", "Соавтор", ai)}${b("mine", "Мои", mine)}</div></div>`;

// ——— Поиск и замена ———
let finds = [], findI = 0;
function openFind() {
  if (current !== "scene") { STATE.sc = 14; open("scene"); }
  const f = $("#find"), sel = getSelection(), pre = sel.rangeCount && !sel.isCollapsed && sel.toString().length < 60 ? sel.toString().trim() : "";
  f.hidden = false; $("#selbar").hidden = true;
  if (pre) $("#findin").value = pre;
  renderFindScope(); $("#findin").focus(); $("#findin").select(); runFind();
}
function closeFind() { $("#find").hidden = true; CSS.highlights.delete("find"); CSS.highlights.delete("find-cur"); finds = []; }
function renderFindScope() {
  $("#findscope").innerHTML = `<button aria-pressed="${STATE.findScope === "scene"}" data-act="find-scope" data-k="scene">Сцена ${STATE.sc}</button><button aria-pressed="${STATE.findScope === "act"}" data-act="find-scope" data-k="act">Весь акт II</button>`;
}
function runFind(keep) {
  const q = $("#findin").value.toLowerCase(); finds = [];
  if (q) bodies().forEach((b) => {
    const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (n.parentElement.closest("del")) continue;
      const t = n.data.toLowerCase();
      for (let i = t.indexOf(q); i >= 0; i = t.indexOf(q, i + q.length)) {
        const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length);
        finds.push({ r, sc: Number(b.dataset.sc), locked: b.classList.contains("locked") });
      }
    }
  });
  findI = finds.length ? (keep ? Math.min(findI, finds.length - 1) : 0) : 0;
  CSS.highlights.set("find", new Highlight(...finds.map((f) => f.r)));
  markFind(!keep);
}
function markFind(scroll) {
  const f = finds[findI], q = $("#findin").value;
  CSS.highlights.set("find-cur", new Highlight(...(f ? [f.r] : [])));
  $("#findn").textContent = !q ? "" : finds.length ? `${findI + 1} из ${finds.length}` : "нет";
  const locked = finds.filter((x) => x.locked).length;
  $("#findnote").textContent = locked ? `${locked} в утверждённой сцене — не заменяется` : "";
  ["#findprev", "#findnext"].forEach((x) => ($(x).disabled = finds.length < 2));
  ["#reponce", "#repall"].forEach((x) => ($(x).disabled = !finds.some((y) => !y.locked)));
  if (f && scroll) {
    const r = f.r.getBoundingClientRect(), mid = (64 + bottomLimit()) / 2;
    if (r.top < 140 || r.bottom > bottomLimit() - 20) $("#desk").scrollBy({ top: r.top - mid, behavior: "instant" });
  }
}
function replaceAt(f, text) {
  f.r.deleteContents(); f.r.insertNode(document.createTextNode(text)); f.r.startContainer.parentElement.normalize();
}
function afterReplace() { saveScript(); nameMarks(); touched(); runFind(true); renderPath(); refreshScp(); requestAnimationFrame(layoutNotes); }

Object.assign(ACTIONS, {
  scp() { STATE.scpOpen = !STATE.scpOpen; refreshScp(); },
  "scp-color"(b, k) { SCRIPT[STATE.sc].params.color = k; refreshScp(); toast("Цвет карточки сцены изменён — так она выглядит и в «Карточках сцен»."); },
  mfilter(b, k) { STATE.mfilter = k; $("#margin").dataset.f = k; $("#desk .stage").dataset.f = k; $("#margin .mfilter").outerHTML = mfilterHtml(STATE.scMode === "scene" ? [STATE.sc] : Object.keys(SCRIPT).map(Number)); requestAnimationFrame(layoutNotes); },
  "my-go"(b, k) {
    const d = dynOf(k);
    if (d.sc !== STATE.sc && STATE.scMode === "scene") { STATE.sc = d.sc; open("scene"); }
    const m = $(`#desk [data-a="${k}"]`); m.scrollIntoView({ behavior: "smooth", block: "center" }); highlight(k);
  },
  "find-step"(b, k) { if (!finds.length) return; findI = (findI + Number(k) + finds.length) % finds.length; markFind(true); },
  "find-close"() { closeFind(); },
  "find-rep-toggle"(b) { const row = $("#findrep"); row.hidden = !row.hidden; b.setAttribute("aria-pressed", String(!row.hidden)); if (!row.hidden) $("#repin").focus(); },
  "find-scope"(b, k) {
    STATE.findScope = k; STATE.scMode = k; open("scene"); renderFindScope();
    requestAnimationFrame(() => { runFind(); $("#findin").focus(); });
  },
  "find-rep"() {
    const f = finds[findI]; if (!f) return;
    if (f.locked) { const i = finds.findIndex((x, j) => j > findI && !x.locked); findI = i >= 0 ? i : finds.findIndex((x) => !x.locked); markFind(true); return toast("Это утверждённая сцена 13 — перешёл к следующему совпадению."); }
    replaceAt(f, $("#repin").value); afterReplace();
  },
  "find-rep-all"() {
    const todo = finds.filter((f) => !f.locked), skip = finds.length - todo.length;
    todo.reverse().forEach((f) => replaceAt(f, $("#repin").value)); afterReplace();
    toast(`Заменено: ${todo.length}.${skip ? ` В утверждённой сцене 13 не тронуто: ${skip} — её правка идёт через проверку последствий.` : ""} Вернуть можно в истории версий.`);
  },
});
["scp-color", "find-rep", "find-rep-all"].forEach((a) => SAVES.add(a));
document.addEventListener("input", (e) => {
  if (e.target.id === "findin") { runFind(); return; }

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && ["f", "F", "а", "А"].includes(e.key) && ["scene"].includes(current)) { e.preventDefault(); openFind(); return; }
  if (e.target.id === "findin" || e.target.id === "repin") {

    if (e.key === "Enter") { e.preventDefault(); if (e.target.id === "repin") ACTIONS["find-rep"](); else ACTIONS["find-step"](null, e.shiftKey ? "-1" : "1"); }
  }
  if (e.target.matches && e.target.matches("[data-goal]") && e.key === "Enter") { e.preventDefault(); e.target.blur(); toast("Цель сцены записана. «Поэпизодник» обновлю после проверки последствий."); }
});

let editTimer;
document.addEventListener("input", (e) => {
  const body = e.target.closest && e.target.closest(".script-body[contenteditable=true]"); if (!body) return;
  if (!body.querySelector(":scope > p")) { body.innerHTML = ""; body.append(blankP("ac")); placeCaret(body.firstChild, true); }

  markElt(); requestAnimationFrame(layoutNotes);

});
document.addEventListener("keydown", (e) => {
  const pop = $("#acpop");
  if (!pop.hidden && acPara) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); acSel = (acSel + (e.key === "ArrowDown" ? 1 : -1) + acItems.length) % acItems.length; pop.querySelectorAll("[data-ac]").forEach((x, i) => x.classList.toggle("on", i === acSel)); return; }

  }

  if (e.key === "Tab") {

    const n = blankP(ON_TAB[t]); p.after(n); placeCaret(n, false); keepInView(n); markElt(); suggest(); return;
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (empty) { setType(p, ON_ENTER[t]); return; }
    const sel = getSelection(); if (!sel.isCollapsed) sel.deleteFromDocument();
    const atEnd = caretAtEnd(p), n = blankP(atEnd ? ON_ENTER[t] : t);
    if (!atEnd) { const r = document.createRange(); r.setStart(sel.focusNode, sel.focusOffset); r.setEnd(p, p.childNodes.length); n.innerHTML = ""; n.append(r.extractContents()); syncBlank(n); syncBlank(p); if (!p.textContent) p.innerHTML = "<br>"; }

  }
});

// Слои редактора не уводят фокус из текста
["#selbar", "#acpop", "#elt", "#eltbar"].forEach((q) => document.addEventListener("mousedown", (e) => { if (e.target.closest(q) && !e.target.closest("textarea")) e.preventDefault(); }));
