# openspec/config.yaml
schema: spec-driven

# Инжектится во ВСЕ артефакты. Держать коротким (лимит ~50 КБ).
context: |
  Продукт: Authorled — веб-сервис, который проводит писателя или сценариста через методологию из 22 документов от замысла до готового произведения; ИИ спрашивает, предлагает и проверяет связность, каждый документ утверждает автор. Этот репозиторий — монорепозиторий из трёх модулей: бэкенд на Agno (AgentOS) в `agno/`, фронтенд в `web/`, деплой-часть авторизации (Authentik) в `auth/`; в корне — общее (compose, `openspec/`, скрипты стека).
  Стек бэкенда: Python 3.14, Agno 3.1.10 (FastAPI), PostgreSQL 18 + pgvector, Alembic, pytest, Docker Compose; модели через LiteLLM.
  Стек фронтенда (ADR-004): React + TypeScript, shadcn/ui на Tailwind CSS; Refine, CopilotKit, `@plotwell/editor`.

  Если описание в _raw расходится с актуальным кодом — верь коду, спорное выноси человеку.

  Перед созданием ЛЮБОГО артефакта обязательно прочитай файлы из openspec/context/:
  - 00-start-here.md — навигация и главные запреты
  - 01-product-context.md — что за продукт, сценарии, что нельзя ломать
  - 02-domain-glossary.md — доменные термины
  - 03-architecture.md — сервисы, слои, инварианты, ADR
  - 04-engineering-standards.md — конвенции кода
  - 05-security-and-compliance.md — ограничения по данным и ИБ
  - 06-testing-and-quality.md — что и как тестировать
  - 07-anti-patterns.md — deprecated и чего не делать
  Если нужного контекста не хватает — НЕ угадывай, явно сформулируй, какого.

# Инжектится только в свой артефакт.
rules:
  proposal:
    - Всегда заполняй Scope и Non-goals; ничего вне scope.
    - Требования противоречат друг другу или источникам — подними вопрос человеку, не выбирай интуитивно.
  specs:
    - Если описание в _raw расходится с кодом — верь коду, не угадывай.
    - Используй формат Given/When/Then.
  design:
    - Опирайся на инварианты из 03-architecture.md и релевантные ADR из context/ADR/.
  tasks:
    - Не делай refactor вне задачи; паттерны из 07-anti-patterns.md запрещены.
